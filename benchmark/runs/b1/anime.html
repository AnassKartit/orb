<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch Week</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { --bg:#0b0f1a; --panel:#131a2b; --text:#eef2ff; --muted:#8b95b3; --accent:#6ee7b7; --blue:#60a5fa; --violet:#a78bfa; --amber:#fbbf24; --grid:#222b44; }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { width:100%; height:100%; background:#05070d; overflow:hidden; }
  body { display:flex; align-items:center; justify-content:center; font-family:'Inter','Segoe UI',system-ui,sans-serif; color:var(--text); }
  #stage { position:relative; width:1280px; height:720px; flex:none; background:radial-gradient(900px 500px at 20% 0%, #172042 0%, var(--bg) 60%); overflow:hidden; transform-origin:center center; }
  .scene { position:absolute; inset:0; opacity:0; }
  .center { display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; }
  h1 { font-size:112px; font-weight:800; letter-spacing:-3px; line-height:1; }
  h1 .w { display:inline-block; }
  .sub { margin-top:28px; font-size:34px; color:var(--muted); font-weight:400; letter-spacing:.5px; }
  .rule { width:120px; height:4px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--blue)); margin-top:36px; transform-origin:left; }
  .label { font-size:22px; letter-spacing:6px; text-transform:uppercase; color:var(--muted); }
  #s2 .head { position:absolute; left:100px; top:60px; }
  #counter { font-size:150px; font-weight:800; letter-spacing:-4px; line-height:1.05; font-variant-numeric:tabular-nums; background:linear-gradient(90deg,var(--accent),var(--blue)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  #bars { position:absolute; left:100px; right:100px; top:330px; height:300px; display:flex; align-items:flex-end; gap:28px; border-bottom:2px solid var(--grid); }
  .col { flex:1; height:100%; display:flex; flex-direction:column; justify-content:flex-end; align-items:center; position:relative; }
  .bar { width:100%; border-radius:10px 10px 0 0; background:linear-gradient(180deg,#3b4a78,#2a3558); transform-origin:bottom; transform:scaleY(0); }
  .bar.peak { background:linear-gradient(180deg,var(--amber),#f59e0b); }
  .val { position:absolute; font-size:22px; font-weight:600; color:var(--text); opacity:0; }
  .day { position:absolute; bottom:-40px; font-size:20px; color:var(--muted); }
  .badge { position:absolute; top:-6px; font-size:16px; font-weight:700; color:#1a1203; background:var(--amber); padding:4px 10px; border-radius:999px; opacity:0; letter-spacing:1px; }
  #s3 .ttl { position:absolute; top:60px; font-size:22px; letter-spacing:5px; text-transform:uppercase; color:var(--muted); }
  .card { position:absolute; top:130px; height:500px; background:var(--panel); border:1px solid #1f2944; border-radius:24px; padding:30px; }
  #cardL { left:80px; width:600px; }
  #cardR { left:710px; width:490px; }
  .card h3 { font-size:26px; font-weight:600; }
  .card .note { font-size:18px; color:var(--muted); margin-top:4px; }
  .legend { position:absolute; left:290px; top:170px; display:flex; flex-direction:column; gap:22px; }
  .li { display:flex; align-items:center; gap:12px; font-size:22px; opacity:0; }
  .li i { width:16px; height:16px; border-radius:5px; display:block; }
  .li b { margin-left:auto; padding-left:20px; font-weight:700; }
  svg text { font-family:inherit; }
</style>
</head>
<body>
<div id="stage">

  <div id="s1" class="scene center">
    <h1 id="title"><span class="w">Launch</span> <span class="w">Week</span></h1>
    <div class="sub" id="subtitle">Signups beat the plan</div>
    <div class="rule" id="rule"></div>
  </div>

  <div id="s2" class="scene">
    <div class="head">
      <div class="label">Signups</div>
      <div id="counter">0</div>
    </div>
    <div id="bars"></div>
  </div>

  <div id="s3" class="scene">
    <div class="ttl" style="left:80px">Retention &amp; platform mix</div>
    <div class="card" id="cardL">
      <h3>Retention</h3>
      <div class="note">% of users retained, by day</div>
      <svg id="line" viewBox="0 0 540 380" width="540" height="380" style="position:absolute;left:30px;top:100px"></svg>
    </div>
    <div class="card" id="cardR">
      <h3>Platform split</h3>
      <div class="note">Share of signups</div>
      <svg id="donut" viewBox="0 0 220 220" width="220" height="220" style="position:absolute;left:30px;top:150px"></svg>
      <div class="legend" id="legend"></div>
    </div>
  </div>

  <div id="s4" class="scene center">
    <h1 id="thanks">Thank you</h1>
    <div class="rule" id="rule2" style="margin-top:36px"></div>
  </div>

</div>

<script type="module">
import { animate, createTimeline, stagger, createDrawable, createSpring, utils } from 'https://cdn.jsdelivr.net/npm/animejs@4/+esm';

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const n = document.createElementNS(NS, tag); for (const k in attrs) n.setAttribute(k, attrs[k]); parent && parent.appendChild(n); return n; };

// fit stage to window
const stage = document.getElementById('stage');
const fit = () => { stage.style.transform = `scale(${Math.min(innerWidth/1280, innerHeight/720)})`; };
fit(); addEventListener('resize', fit);

// ---- bars ----
const data = [120, 340, 560, 800, 1100, 980, 900];
const max = 1100, H = 250;
const barsEl = document.getElementById('bars');
const peakIdx = data.indexOf(max);
data.forEach((v, i) => {
  const col = document.createElement('div'); col.className = 'col';
  const h = Math.round(v / max * H);
  col.innerHTML = `<div class="bar${i === peakIdx ? ' peak' : ''}" style="height:${h}px"></div>
    <div class="val" style="bottom:${h + 12}px">${v.toLocaleString('en-US')}</div>
    <div class="day">Day ${i + 1}</div>` + (i === peakIdx ? `<div class="badge" style="bottom:${h + 48}px">PEAK</div>` : '');
  barsEl.appendChild(col);
});
// peak starts muted, gets highlighted later
const peakBar = barsEl.querySelector('.bar.peak');
peakBar.classList.remove('peak');

// ---- line chart ----
const ret = [62, 58, 55, 54, 53, 52];
const lsvg = document.getElementById('line');
const L = { x0: 50, x1: 510, y0: 20, y1: 320, lo: 48, hi: 66 };
const px = i => L.x0 + i * (L.x1 - L.x0) / (ret.length - 1);
const py = v => L.y1 - (v - L.lo) / (L.hi - L.lo) * (L.y1 - L.y0);
[50, 55, 60, 65].forEach(g => {
  el('line', { x1: L.x0, x2: L.x1, y1: py(g), y2: py(g), stroke: '#222b44', 'stroke-width': 1 }, lsvg);
  const t = el('text', { x: L.x0 - 12, y: py(g) + 5, fill: '#8b95b3', 'font-size': 15, 'text-anchor': 'end' }, lsvg); t.textContent = g + '%';
});
ret.forEach((_, i) => { const t = el('text', { x: px(i), y: 350, fill: '#8b95b3', 'font-size': 15, 'text-anchor': 'middle' }, lsvg); t.textContent = 'D' + (i + 1); });
const pts = ret.map((v, i) => [px(i), py(v)]);
let d = `M${pts[0][0]},${pts[0][1]}`;
for (let i = 0; i < pts.length - 1; i++) {
  const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
  d += ` C${p1[0] + (p2[0] - p0[0]) / 6},${p1[1] + (p2[1] - p0[1]) / 6} ${p2[0] - (p3[0] - p1[0]) / 6},${p2[1] - (p3[1] - p1[1]) / 6} ${p2[0]},${p2[1]}`;
}
const area = el('path', { d: d + ` L${L.x1},${L.y1} L${L.x0},${L.y1} Z`, fill: 'rgba(96,165,250,.12)', opacity: 0 }, lsvg);
const linePath = el('path', { d, fill: 'none', stroke: '#60a5fa', 'stroke-width': 5, 'stroke-linecap': 'round' }, lsvg);
const dots = pts.map((p, i) => {
  const g = el('g', { opacity: 0 }, lsvg);
  el('circle', { cx: p[0], cy: p[1], r: 7, fill: '#0b0f1a', stroke: '#60a5fa', 'stroke-width': 4 }, g);
  const t = el('text', { x: p[0], y: p[1] - 18, fill: '#eef2ff', 'font-size': 17, 'font-weight': 600, 'text-anchor': 'middle' }, g);
  t.textContent = ret[i] + '%';
  return g;
});
const lineDraw = createDrawable(linePath);

// ---- donut ----
const split = [['iOS', 48, '#60a5fa'], ['Android', 36, '#6ee7b7'], ['Web', 16, '#a78bfa']];
const dsvg = document.getElementById('donut');
const cx = 110, cy = 110, r = 85, gap = 2.5;
let a = -90;
const arcs = split.map(([name, pct, color]) => {
  const sweep = pct / 100 * 360;
  const s = (a + gap) * Math.PI / 180, e = (a + sweep - gap) * Math.PI / 180;
  const large = (sweep - 2 * gap) > 180 ? 1 : 0;
  const path = el('path', { d: `M${cx + r * Math.cos(s)},${cy + r * Math.sin(s)} A${r},${r} 0 ${large} 1 ${cx + r * Math.cos(e)},${cy + r * Math.sin(e)}`, fill: 'none', stroke: color, 'stroke-width': 28, 'stroke-linecap': 'butt' }, dsvg);
  a += sweep;
  return path;
});
const ct = el('text', { x: cx, y: cy + 10, fill: '#eef2ff', 'font-size': 30, 'font-weight': 800, 'text-anchor': 'middle', opacity: 0 }, dsvg);
ct.textContent = 'iOS 48%';
ct.setAttribute('font-size', 22);
const arcDraw = arcs.map(p => createDrawable(p));
const legend = document.getElementById('legend');
split.forEach(([n, p, c]) => { const li = document.createElement('div'); li.className = 'li'; li.innerHTML = `<i style="background:${c}"></i>${n}<b>${p}%</b>`; legend.appendChild(li); });

// ---- initial states ----
utils.set('#title .w', { opacity: 0, translateY: 50 });
utils.set('#subtitle', { opacity: 0, translateY: 20 });
utils.set(['#rule', '#rule2'], { scaleX: 0 });
utils.set('#thanks', { opacity: 0, translateY: 40, scale: .96 });
utils.set(['#cardL', '#cardR'], { opacity: 0, translateY: 30 });
utils.set('#s2 .head', { opacity: 0, translateX: -30 });
lineDraw.forEach ? 0 : 0;
utils.set(lineDraw, { draw: '0 0' });
arcDraw.forEach(dw => utils.set(dw, { draw: '0 0' }));

// ---- timeline (10s) ----
const tl = createTimeline({ defaults: { ease: 'outQuart' } });
const cnt = { v: 0 }, counterEl = document.getElementById('counter');

// Scene 1: title (0 - 2.2s)
tl.add('#s1', { opacity: 1, duration: 1 }, 0)
  .add('#title .w', { opacity: 1, translateY: 0, duration: 900, delay: stagger(140) }, 150)
  .add('#rule', { scaleX: 1, duration: 700, ease: 'inOutQuart' }, 700)
  .add('#subtitle', { opacity: 1, translateY: 0, duration: 800 }, 900)
  .add('#s1', { opacity: 0, translateY: -20, duration: 450, ease: 'inQuad' }, 2000)

// Scene 2: counter + bars (2.2 - 5.6s)
  .add('#s2', { opacity: 1, duration: 400, ease: 'outQuad' }, 2200)
  .add('#s2 .head', { opacity: 1, translateX: 0, duration: 700 }, 2250)
  .add(cnt, { v: 4800, duration: 2300, ease: 'outExpo', onUpdate: () => { counterEl.textContent = Math.round(cnt.v).toLocaleString('en-US'); } }, 2400)
  .add('.bar', { scaleY: 1, duration: 900, delay: stagger(110), ease: createSpring({ stiffness: 140, damping: 16 }) }, 2700)
  .add('.val', { opacity: 1, duration: 400, delay: stagger(110) }, 3100)
  .add('.day', { opacity: [0, 1], duration: 400, delay: stagger(60) }, 2900)
  .add(peakBar, { backgroundImage: 'linear-gradient(180deg,#fbbf24,#f59e0b)', scaleX: 1.08, duration: 500, ease: 'outBack' }, 4000)
  .add('.badge', { opacity: 1, translateY: [8, 0], duration: 500 }, 4200)
  .add('#s2', { opacity: 0, translateY: -20, duration: 450, ease: 'inQuad' }, 5200)

// Scene 3: line + donut (5.6 - 8.3s)
  .add('#s3', { opacity: 1, duration: 1 }, 5650)
  .add(['#cardL', '#cardR'], { opacity: 1, translateY: 0, duration: 700, delay: stagger(120) }, 5650)
  .add(lineDraw, { draw: '0 1', duration: 1500, ease: 'inOutCubic' }, 6100)
  .add(area, { opacity: 1, duration: 800, ease: 'outQuad' }, 7000)
  .add(dots, { opacity: 1, duration: 400, delay: stagger(220) }, 6300)
  .add(arcDraw[0], { draw: '0 1', duration: 800, ease: 'inOutCubic' }, 6200)
  .add(arcDraw[1], { draw: '0 1', duration: 700, ease: 'inOutCubic' }, 6900)
  .add(arcDraw[2], { draw: '0 1', duration: 500, ease: 'inOutCubic' }, 7500)
  .add(ct, { opacity: 1, duration: 500 }, 7300)
  .add('.li', { opacity: 1, translateX: [-16, 0], duration: 600, delay: stagger(150) }, 6500)
  .add('#s3', { opacity: 0, translateY: -20, duration: 450, ease: 'inQuad' }, 8200)

// Scene 4: thank you (8.6 - 10s)
  .add('#s4', { opacity: 1, duration: 1 }, 8650)
  .add('#thanks', { opacity: 1, translateY: 0, scale: 1, duration: 900 }, 8650)
  .add('#rule2', { scaleX: 1, duration: 700, ease: 'inOutQuart' }, 9000);
</script>
</body>
</html>
