<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Launch Week</title>
<style>
  html,body{margin:0;height:100%;background:#05070d;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1280px;height:720px;flex:none;transform-origin:center center;
    background:radial-gradient(900px 500px at 20% 10%,#14203d 0%,transparent 60%),radial-gradient(800px 500px at 90% 100%,#2a1442 0%,transparent 60%),#0a0e1a;
    font-family:"Inter","Segoe UI",system-ui,sans-serif;color:#eaf0ff;overflow:hidden}
  .scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{font-size:112px;margin:0;font-weight:800;letter-spacing:-3px;background:linear-gradient(90deg,#7cc4ff,#a98bff 60%,#ff8ad1);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{font-size:32px;color:#9fb0d6;margin-top:18px;letter-spacing:.5px}
  .label{font-size:22px;letter-spacing:6px;text-transform:uppercase;color:#7f91bd}
  .big{font-size:140px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;margin-top:4px;color:#fff}
  .tag{position:absolute;left:60px;top:48px;font-size:18px;letter-spacing:5px;text-transform:uppercase;color:#7f91bd}
  .card{position:absolute;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:22px}
  .ctitle{position:absolute;font-size:20px;letter-spacing:3px;text-transform:uppercase;color:#9fb0d6}
  svg{position:absolute;left:0;top:0;overflow:visible}
  text{font-family:inherit;fill:#9fb0d6;font-size:16px}
  .legend{position:absolute;display:flex;flex-direction:column;gap:16px;font-size:22px}
  .legend div{display:flex;align-items:center;gap:12px;opacity:0}
  .legend i{width:16px;height:16px;border-radius:5px;display:inline-block}
  .legend b{margin-left:auto;padding-left:30px;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="stage">

  <div class="scene center" id="s1">
    <h1 id="t1">Launch Week</h1>
    <div class="sub" id="t1s">Signups beat the plan</div>
  </div>

  <div class="scene" id="s2">
    <div class="tag">Launch Week</div>
    <div class="center" style="position:absolute;left:0;right:0;top:70px">
      <div class="label">Signups</div>
      <div class="big" id="count">0</div>
    </div>
    <svg id="bars" width="1280" height="720"></svg>
  </div>

  <div class="scene" id="s3">
    <div class="tag">Launch Week</div>
    <div class="card" style="left:60px;top:110px;width:600px;height:520px"></div>
    <div class="card" style="left:690px;top:110px;width:530px;height:520px"></div>
    <div class="ctitle" style="left:90px;top:136px">Retention %</div>
    <div class="ctitle" style="left:720px;top:136px">Platform split</div>
    <svg id="line" width="1280" height="720"></svg>
    <svg id="donut" width="1280" height="720"></svg>
    <div class="legend" id="legend" style="left:1000px;top:300px"></div>
  </div>

  <div class="scene center" id="s4">
    <h1 id="t4">Thank you</h1>
  </div>
</div>

<script>
(function(){
  const NS="http://www.w3.org/2000/svg";
  const $=id=>document.getElementById(id);
  const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
  const ease=t=>1-Math.pow(1-clamp(t),3);
  const eio=t=>{t=clamp(t);return t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2};
  const seg=(t,a,b)=>clamp((t-a)/(b-a));
  function el(p,n,a){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}

  // scale stage to fit window
  const stage=$("stage");
  function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform="scale("+s+")"}
  addEventListener("resize",fit);fit();

  // ---- Bars
  const bars=$("bars"),data=[120,340,560,800,1100,980,900],days=["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];
  const defs=el(bars,"defs",{});
  const g1=el(defs,"linearGradient",{id:"gb",x1:0,y1:0,x2:0,y2:1});
  el(g1,"stop",{offset:0,"stop-color":"#5aa8ff"});el(g1,"stop",{offset:1,"stop-color":"#2b4a8f"});
  const g2=el(defs,"linearGradient",{id:"gp",x1:0,y1:0,x2:0,y2:1});
  el(g2,"stop",{offset:0,"stop-color":"#ffd36e"});el(g2,"stop",{offset:1,"stop-color":"#ff7a59"});
  const bx0=200,bw=92,gap=30,base=670,maxH=330,peak=data.indexOf(Math.max(...data));
  el(bars,"line",{x1:160,x2:1120,y1:base,y2:base,stroke:"rgba(255,255,255,.15)"});
  const barEls=data.map((v,i)=>{
    const x=bx0+i*(bw+gap);
    const r=el(bars,"rect",{x,y:base,width:bw,height:0,rx:10,fill:i==peak?"url(#gp)":"url(#gb)"});
    const val=el(bars,"text",{x:x+bw/2,y:base-10,"text-anchor":"middle",opacity:0,style:"font-size:20px;font-weight:700;fill:"+(i==peak?"#ffd36e":"#eaf0ff")});
    val.textContent=v.toLocaleString("en-US");
    const d=el(bars,"text",{x:x+bw/2,y:base+26,"text-anchor":"middle"});d.textContent=days[i];
    return {r,val,x,h:v/1100*maxH,v};
  });
  const peakTag=el(bars,"text",{x:barEls[peak].x+bw/2,y:0,"text-anchor":"middle",opacity:0,style:"font-size:15px;letter-spacing:3px;fill:#ffd36e;font-weight:700"});
  peakTag.textContent="PEAK DAY";

  // ---- Line chart
  const line=$("line"),ret=[62,58,55,54,53,52];
  const lx0=120,lx1=620,ly0=230,ly1=560,vmin=45,vmax=65;
  const lp=ret.map((v,i)=>[lx0+i*(lx1-lx0)/5,ly1-(v-vmin)/(vmax-vmin)*(ly1-ly0)]);
  [45,50,55,60,65].forEach(v=>{const y=ly1-(v-vmin)/(vmax-vmin)*(ly1-ly0);
    el(line,"line",{x1:lx0-20,x2:lx1+20,y1:y,y2:y,stroke:"rgba(255,255,255,.08)"});
    const t=el(line,"text",{x:lx0-30,y:y+5,"text-anchor":"end"});t.textContent=v;});
  for(let i=0;i<6;i++){const t=el(line,"text",{x:lp[i][0],y:ly1+40,"text-anchor":"middle"});t.textContent="D"+(i+1)}
  // smooth path (catmull-rom -> bezier)
  let d="M"+lp[0][0]+","+lp[0][1];
  for(let i=0;i<5;i++){
    const p0=lp[Math.max(0,i-1)],p1=lp[i],p2=lp[i+1],p3=lp[Math.min(5,i+2)];
    d+=" C"+(p1[0]+(p2[0]-p0[0])/6)+","+(p1[1]+(p2[1]-p0[1])/6)+" "+(p2[0]-(p3[0]-p1[0])/6)+","+(p2[1]-(p3[1]-p1[1])/6)+" "+p2[0]+","+p2[1];
  }
  const ld=el(line,"defs",{});const lg=el(ld,"linearGradient",{id:"lg",x1:0,y1:0,x2:1,y2:0});
  el(lg,"stop",{offset:0,"stop-color":"#6fe3c1"});el(lg,"stop",{offset:1,"stop-color":"#5aa8ff"});
  const area=el(line,"path",{d:d+" L"+lx1+","+ly1+" L"+lx0+","+ly1+" Z",fill:"rgba(90,168,255,.12)",opacity:0});
  const path=el(line,"path",{d,fill:"none",stroke:"url(#lg)","stroke-width":5,"stroke-linecap":"round"});
  const plen=path.getTotalLength();path.style.strokeDasharray=plen;path.style.strokeDashoffset=plen;
  const dots=lp.map((p,i)=>{
    const c=el(line,"circle",{cx:p[0],cy:p[1],r:0,fill:"#0a0e1a",stroke:"#6fe3c1","stroke-width":3});
    const t=el(line,"text",{x:p[0],y:p[1]-18,"text-anchor":"middle",opacity:0,style:"font-weight:700;fill:#eaf0ff;font-size:17px"});t.textContent=ret[i]+"%";
    return {c,t};
  });

  // ---- Donut
  const donut=$("donut"),plat=[["iOS",48,"#5aa8ff"],["Android",36,"#6fe3c1"],["Web",16,"#ffb86b"]];
  const cx=860,cy=400,R=105,SW=44,C=2*Math.PI*R;
  el(donut,"circle",{cx,cy,r:R,fill:"none",stroke:"rgba(255,255,255,.06)","stroke-width":SW});
  let acc=0;
  const arcs=plat.map(p=>{
    const len=p[1]/100*C;
    const c=el(donut,"circle",{cx,cy,r:R,fill:"none",stroke:p[2],"stroke-width":SW,
      transform:"rotate(-90 "+cx+" "+cy+")"});
    const o={c,len,start:acc};acc+=len;return o;
  });
  const dc=el(donut,"text",{x:cx,y:cy+10,"text-anchor":"middle",style:"font-size:34px;font-weight:800;fill:#fff"});dc.textContent="48%";
  const dl=el(donut,"text",{x:cx,y:cy+36,"text-anchor":"middle",style:"font-size:14px;letter-spacing:3px"});dl.textContent="iOS";
  const leg=$("legend");
  const legEls=plat.map(p=>{const r=document.createElement("div");
    r.innerHTML='<i style="background:'+p[2]+'"></i>'+p[0]+'<b>'+p[1]+'%</b>';leg.appendChild(r);return r});

  // ---- Timeline (10s)
  const s=[$("s1"),$("s2"),$("s3"),$("s4")];
  const T=10000;
  function frame(t){ // t seconds
    // scene opacity windows
    const win=[[0,2.6],[2.3,5.4],[5.1,8.6],[8.3,10.01]];
    s.forEach((e,i)=>{
      const [a,b]=win[i];
      const fin=seg(t,a,a+.5), fout=i<3?1-seg(t,b-.4,b):1;
      const o=ease(fin)*fout;
      e.style.opacity=o;
      e.style.transform="translateY("+((1-ease(fin))*18-(i<3?(1-fout)*10:0))+"px) scale("+(0.985+0.015*ease(fin))+")";
    });
    // scene 1
    const a=ease(seg(t,0.1,1.1));
    $("t1").style.transform="scale("+(0.92+0.08*a)+")";
    $("t1").style.letterSpacing=(-3+(1-a)*14)+"px";
    $("t1s").style.opacity=ease(seg(t,0.9,1.7));
    $("t1s").style.transform="translateY("+(1-ease(seg(t,0.9,1.7)))*14+"px)";
    // scene 2
    const cv=Math.round(4800*eio(seg(t,2.7,4.7)));
    $("count").textContent=cv.toLocaleString("en-US");
    barEls.forEach((b,i)=>{
      const k=ease(seg(t,3.0+i*0.14,3.9+i*0.14));
      b.r.setAttribute("height",b.h*k);b.r.setAttribute("y",base-b.h*k);
      b.val.setAttribute("y",base-b.h*k-12);b.val.setAttribute("opacity",seg(t,3.5+i*0.14,4.1+i*0.14));
    });
    const pk=barEls[peak],pf=ease(seg(t,4.3,4.9));
    peakTag.setAttribute("y",base-pk.h-44);peakTag.setAttribute("opacity",pf);
    const pulse=pf*(0.5+0.5*Math.sin(t*5))*0.25;
    pk.r.setAttribute("transform","translate("+(pk.x+bw/2)+" "+base+") scale("+(1+pulse*0.08)+" 1) translate("+(-(pk.x+bw/2))+" "+(-base)+")");
    // scene 3
    const lk=eio(seg(t,5.4,7.0));
    path.style.strokeDashoffset=plen*(1-lk);
    area.setAttribute("opacity",ease(seg(t,6.4,7.2)));
    dots.forEach((o,i)=>{const k=ease(seg(t,5.4+i*0.26,5.8+i*0.26));
      o.c.setAttribute("r",7*k);o.t.setAttribute("opacity",k);});
    const dk=eio(seg(t,5.6,7.4));
    arcs.forEach((o,i)=>{
      const vis=clamp(dk*C-o.start,0,o.len);
      const gapPx=vis>4?2:0;
      o.c.setAttribute("stroke-dasharray",Math.max(0,vis-gapPx)+" "+C);
      o.c.setAttribute("stroke-dashoffset",-o.start);
    });
    legEls.forEach((r,i)=>{const k=ease(seg(t,6.4+i*0.2,7.0+i*0.2));r.style.opacity=k;r.style.transform="translateX("+(1-k)*20+"px)"});
    // scene 4
    const f=ease(seg(t,8.4,9.3));
    $("t4").style.transform="scale("+(0.9+0.1*f)+")";
    $("t4").style.opacity=f;
  }

  let start=null;
  function loop(now){
    if(start===null)start=now;
    let el=(now-start)%(T+1200);
    frame(Math.min(el,T)/1000);
    requestAnimationFrame(loop);
  }
  frame(0);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
