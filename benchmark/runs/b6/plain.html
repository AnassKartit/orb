<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Energy Use</title>
<style>
html,body{margin:0;height:100%;background:#05080c;overflow:hidden}
#stage{position:absolute;left:50%;top:50%;width:1280px;height:720px;transform-origin:center;background:radial-gradient(ellipse at 30% 20%,#12251f 0%,#0a1114 55%,#06090c 100%);overflow:hidden;font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#e8f3ee}
.scene{position:absolute;inset:0;opacity:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{margin:0;font-size:104px;font-weight:700;letter-spacing:-2px;background:linear-gradient(90deg,#6ee7a8,#38bdf8);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:38px;color:#9fb8ad;margin-top:18px;letter-spacing:1px}
.rule{width:120px;height:4px;border-radius:2px;background:#6ee7a8;margin-top:28px}
.label{position:absolute;font-size:22px;letter-spacing:4px;text-transform:uppercase;color:#7f9a8f}
#counter{position:absolute;left:80px;top:60px}
#counter .n{font-size:132px;font-weight:700;line-height:1;color:#6ee7a8;font-variant-numeric:tabular-nums}
#counter .u{font-size:36px;color:#9fb8ad;margin-left:12px}
svg{position:absolute;left:0;top:0}
text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
</style>
</head>
<body>
<div id="stage">
  <div class="scene center" id="s1"><h1>Energy Use</h1><div class="sub">Down 12% this year</div><div class="rule"></div></div>

  <div class="scene" id="s2">
    <div class="label" style="left:80px;top:40px">Saved</div>
    <div id="counter" style="top:72px"><span class="n" id="cnt">0</span><span class="u">kWh</span></div>
    <svg id="bars" width="1280" height="720"></svg>
  </div>

  <div class="scene" id="s3">
    <div class="label" style="left:80px;top:44px">Renewable share</div>
    <div class="label" style="left:740px;top:44px">Consumption by source</div>
    <svg id="mid" width="1280" height="720"></svg>
  </div>

  <div class="scene center" id="s4"><h1>Keep going</h1><div class="rule"></div></div>
</div>
<script>
(function(){
var NS="http://www.w3.org/2000/svg";
function el(p,t,a,txt){var e=document.createElementNS(NS,t);for(var k in a)e.setAttribute(k,a[k]);if(txt!=null)e.textContent=txt;p.appendChild(e);return e}
function clamp(x){return x<0?0:x>1?1:x}
function eo(x){x=clamp(x);return 1-Math.pow(1-x,3)}
function eio(x){x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function seg(t,a,b){return clamp((t-a)/(b-a))}

var stage=document.getElementById("stage");
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform="translate(-50%,-50%) scale("+s+")"}
fit();addEventListener("resize",fit);

/* bar chart */
var q=["Q1","Q2","Q3","Q4","Q5","Q6"],kwh=[980,910,870,800,760,720];
var svg=document.getElementById("bars");
var base=650,top0=290,bw=110,gap=50,x0=(1280-(6*bw+5*gap))/2,max=1000;
for(var g=0;g<=4;g++){var gy=base-(base-top0)*g/4;el(svg,"line",{x1:x0-20,x2:1280-x0+20,y1:gy,y2:gy,stroke:"#ffffff",opacity:.08});}
var bars=[],vals=[];
for(var i=0;i<6;i++){
  var low=i==5,x=x0+i*(bw+gap);
  var r=el(svg,"rect",{x:x,y:base,width:bw,height:0,rx:8,fill:low?"#6ee7a8":"#2f6f8f"});
  var v=el(svg,"text",{x:x+bw/2,y:base-10,"text-anchor":"middle",fill:low?"#6ee7a8":"#cfe3da","font-size":26,"font-weight":600,opacity:0},kwh[i]);
  el(svg,"text",{x:x+bw/2,y:base+36,"text-anchor":"middle",fill:"#8aa398","font-size":22},q[i]);
  bars.push(r);vals.push(v);
}
var tag=el(svg,"text",{x:x0+5*(bw+gap)+bw/2,y:top0-30,"text-anchor":"middle",fill:"#6ee7a8","font-size":20,"letter-spacing":2,opacity:0},"LOWEST");
el(svg,"text",{x:1280-80,y:60,"text-anchor":"end",fill:"#7f9a8f","font-size":22,"letter-spacing":4},"KWH PER QUARTER");

/* mid scene */
var m=document.getElementById("mid");
var defs=el(m,"defs",{});
var lg=el(defs,"linearGradient",{id:"lg",x1:0,x2:1,y1:0,y2:0});
el(lg,"stop",{offset:"0%","stop-color":"#38bdf8"});el(lg,"stop",{offset:"100%","stop-color":"#6ee7a8"});
var ag=el(defs,"linearGradient",{id:"ag",x1:0,x2:0,y1:0,y2:1});
el(ag,"stop",{offset:"0%","stop-color":"#6ee7a8","stop-opacity":.25});el(ag,"stop",{offset:"100%","stop-color":"#6ee7a8","stop-opacity":0});
var cl=el(defs,"clipPath",{id:"cp"});var cr=el(cl,"rect",{x:80,y:100,width:0,height:600});
var lx=80,lw=560,ly0=600,ly1=190,share=[22,28,35,41,48,55];
function px(i){return lx+20+i*(lw-40)/5}
function py(v){return ly0-(v-10)/(60-10)*(ly0-ly1)}
for(var g=0;g<=4;g++){var yy=ly0-(ly0-ly1)*g/4;el(m,"line",{x1:lx,x2:lx+lw,y1:yy,y2:yy,stroke:"#fff",opacity:.08});el(m,"text",{x:lx-10,y:yy+6,"text-anchor":"end",fill:"#6f877d","font-size":18},Math.round(10+50*g/4)+"%")}
var pts=share.map(function(v,i){return[px(i),py(v)]});
function path(p){var d="M"+p[0][0]+","+p[0][1];for(var i=0;i<p.length-1;i++){var a=p[i],b=p[i+1],cx=(a[0]+b[0])/2;d+=" C"+cx+","+a[1]+" "+cx+","+b[1]+" "+b[0]+","+b[1]}return d}
var d=path(pts);
el(m,"path",{d:d+" L"+pts[5][0]+","+ly0+" L"+pts[0][0]+","+ly0+" Z",fill:"url(#ag)","clip-path":"url(#cp)"});
el(m,"path",{d:d,fill:"none",stroke:"url(#lg)","stroke-width":5,"stroke-linecap":"round","clip-path":"url(#cp)"});
var dots=[];
pts.forEach(function(p,i){
  var c=el(m,"circle",{cx:p[0],cy:p[1],r:7,fill:"#0a1114",stroke:"#6ee7a8","stroke-width":3,opacity:0});
  var t=el(m,"text",{x:p[0],y:p[1]-18,"text-anchor":"middle",fill:"#dff3ea","font-size":20,"font-weight":600,opacity:0},share[i]+"%");
  el(m,"text",{x:p[0],y:ly0+34,"text-anchor":"middle",fill:"#8aa398","font-size":20},q[i]);
  dots.push([c,t]);
});
/* donut */
var cx=950,cy=350,R=130,sw=56,C=2*Math.PI*R;
var src=[["Solar",38,"#fbbf24"],["Wind",32,"#38bdf8"],["Grid",30,"#8b9bb0"]];
el(m,"circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:"#fff",opacity:.06,"stroke-width":sw});
var segs=[],off=0;
src.forEach(function(s){
  var len=C*s[1]/100;
  var c=el(m,"circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:s[2],"stroke-width":sw,"stroke-dasharray":"0 "+C,transform:"rotate(-90 "+cx+" "+cy+")"});
  segs.push({c:c,len:len,off:off});off+=len;
});
var ct=el(m,"text",{x:cx,y:cy+10,"text-anchor":"middle",fill:"#e8f3ee","font-size":40,"font-weight":700},"100%");
el(m,"text",{x:cx,y:cy+38,"text-anchor":"middle",fill:"#7f9a8f","font-size":16,"letter-spacing":2},"CONSUMPTION");
var leg=[];
src.forEach(function(s,i){
  var y=560+0,x=760+i*165;
  var g=el(m,"g",{opacity:0});
  el(g,"rect",{x:x,y:y-16,width:20,height:20,rx:5,fill:s[2]});
  el(g,"text",{x:x+30,y:y,fill:"#cfe3da","font-size":22},s[0]+" "+s[1]+"%");
  leg.push(g);
});

/* timeline */
var D=10;
var s1=document.getElementById("s1"),s2=document.getElementById("s2"),s3=document.getElementById("s3"),s4=document.getElementById("s4");
function vis(e,t,a,b,fi,fo){ // fade in/out with slight rise
  var o=eo(seg(t,a,a+fi))*(1-eio(seg(t,b-fo,b)));
  e.style.opacity=o;
  e.style.transform="translateY("+((1-eo(seg(t,a,a+fi)))*24-eio(seg(t,b-fo,b))*16)+"px)";
  e.style.visibility=o>0.001?"visible":"hidden";
}
function frame(t){
  vis(s1,t,0,2.4,0.7,0.5);
  vis(s2,t,2.4,5.6,0.5,0.5);
  vis(s3,t,5.6,8.4,0.5,0.5);
  vis(s4,t,8.4,10.01,0.6,0.01);
  s1.querySelector(".rule").style.width=(40+80*eo(seg(t,0.4,1.4)))+"px";
  /* scene 2 */
  var ts=t-2.4;
  document.getElementById("cnt").textContent=Math.round(1250*eio(seg(ts,0.2,2.0))).toLocaleString("en-US");
  for(var i=0;i<6;i++){
    var p=eo(seg(ts,0.35+i*0.14,1.1+i*0.14));
    var h=(base-top0)*kwh[i]/max*p;
    bars[i].setAttribute("height",h);bars[i].setAttribute("y",base-h);
    vals[i].setAttribute("y",base-h-12);vals[i].setAttribute("opacity",p);
  }
  var hl=eio(seg(ts,1.6,2.2));
  tag.setAttribute("opacity",hl);
  bars[5].setAttribute("fill",hl>0?"#6ee7a8":"#2f6f8f");
  bars[5].style.filter="drop-shadow(0 0 "+(18*hl)+"px rgba(110,231,168,"+(0.6*hl)+"))";
  /* scene 3 */
  var tm=t-5.6;
  cr.setAttribute("width",560+40+0 > 0 ? 40+ (lw+40)*eio(seg(tm,0.2,1.6)) : 0);
  dots.forEach(function(d2,i){var p=eo(seg(tm,0.2+i*0.25,0.5+i*0.25));d2[0].setAttribute("opacity",p);d2[1].setAttribute("opacity",p)});
  var dp=eio(seg(tm,0.3,1.8));
  segs.forEach(function(s){
    var L=s.len*dp;
    s.c.setAttribute("stroke-dasharray",Math.max(0,L-2)+" "+C);
    s.c.setAttribute("stroke-dashoffset",-s.off);
  });
  leg.forEach(function(g,i){g.setAttribute("opacity",eo(seg(tm,1.2+i*0.15,1.6+i*0.15)))});
}
var start=null;
function loop(ts){
  if(start===null)start=ts;
  var t=((ts-start)/1000)%D;
  frame(t);
  requestAnimationFrame(loop);
}
frame(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
