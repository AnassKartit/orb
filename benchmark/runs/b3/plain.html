<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FY Recap</title>
<style>
html,body{margin:0;height:100%;background:#05070d;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#stage{position:relative;width:1280px;height:720px;transform-origin:center center;background:radial-gradient(900px 600px at 20% 10%,#16213f 0%,#0a0e1a 55%,#070912 100%);font-family:"Segoe UI",Helvetica,Arial,sans-serif;color:#eaf0ff;overflow:hidden}
.scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
h1{margin:0;font-size:120px;font-weight:800;letter-spacing:-2px;background:linear-gradient(90deg,#7cc4ff,#8b7bff 60%,#4ee0b5);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{margin-top:18px;font-size:34px;color:#9fb0d6;letter-spacing:1px}
.label{position:absolute;left:80px;top:48px;font-size:22px;letter-spacing:4px;text-transform:uppercase;color:#7f91bd}
.big{position:absolute;left:0;right:0;top:78px;text-align:center;font-size:118px;font-weight:800;font-variant-numeric:tabular-nums}
.bigl{position:absolute;left:0;right:0;top:56px;text-align:center;font-size:26px;letter-spacing:6px;color:#8fa2cf;text-transform:uppercase}
svg{position:absolute;left:0;top:0}
svg text{font-family:"Segoe UI",Helvetica,Arial,sans-serif}
.card{position:absolute;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:20px}
.ct{position:absolute;font-size:22px;color:#a9b8dd;letter-spacing:1px}
.legend{position:absolute;left:880px;top:310px;font-size:26px}
.legend div{display:flex;align-items:center;margin:20px 0;opacity:0}
.legend i{width:20px;height:20px;border-radius:6px;margin-right:16px;display:inline-block}
.legend b{margin-left:auto;padding-left:40px;font-variant-numeric:tabular-nums}
#bar{position:absolute;left:0;bottom:0;height:4px;background:linear-gradient(90deg,#7cc4ff,#4ee0b5);width:0}
</style>
</head>
<body>
<div id="stage">
  <div class="scene center" id="s1"><h1 id="t1">FY Recap</h1><div class="sub" id="st1">Growth in every quarter</div></div>

  <div class="scene" id="s2">
    <div class="bigl">Revenue</div>
    <div class="big" id="rev">$0.0M</div>
    <svg width="1280" height="720" id="bars"></svg>
  </div>

  <div class="scene" id="s3">
    <div class="label">Growth &amp; Mix</div>
    <div class="card" style="left:60px;top:110px;width:640px;height:540px"></div>
    <div class="ct" style="left:90px;top:130px">Monthly growth, %</div>
    <div class="card" style="left:730px;top:110px;width:490px;height:540px"></div>
    <div class="ct" style="left:760px;top:130px">Revenue by region</div>
    <svg width="1280" height="720" id="charts"></svg>
    <div class="legend" id="legend"></div>
  </div>

  <div class="scene center" id="s4"><h1>Thank you</h1></div>
  <div id="bar"></div>
</div>
<script>
(function(){
var NS="http://www.w3.org/2000/svg";
var st=document.getElementById("stage");
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);st.style.transform="scale("+s+")"}
fit();addEventListener("resize",fit);

function el(p,n,a){var e=document.createElementNS(NS,n);for(var k in a)e.setAttribute(k,a[k]);p.appendChild(e);return e}
function clamp(x){return Math.max(0,Math.min(1,x))}
function seg(t,a,b){return clamp((t-a)/(b-a))}
function eo(x){return 1-Math.pow(1-x,3)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function eob(x){var c=1.4;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)}

var S=[document.getElementById("s1"),document.getElementById("s2"),document.getElementById("s3"),document.getElementById("s4")];
var rng=[[0,2.6],[2.4,5.6],[5.4,8.6],[8.4,10]];

// bars
var bs=document.getElementById("bars");
var qv=[0.6,0.8,0.9,1.1],ql=["Q1","Q2","Q3","Q4"];
var bx0=290,bw=130,gap=70,base=640,maxh=330,bars=[],vals=[];
el(bs,"defs",{}).innerHTML='<linearGradient id="gb" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b7bd6"/><stop offset="1" stop-color="#2a3a78"/></linearGradient><linearGradient id="gh" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6ff0c4"/><stop offset="1" stop-color="#1fa57f"/></linearGradient>';
el(bs,"line",{x1:240,x2:1040,y1:base,y2:base,stroke:"#2a3558","stroke-width":2});
qv.forEach(function(v,i){
  var x=bx0+i*(bw+gap);
  var r=el(bs,"rect",{x:x,y:base,width:bw,height:0,rx:12,fill:i==3?"url(#gh)":"url(#gb)"});
  var t=el(bs,"text",{x:x+bw/2,y:base-10,"text-anchor":"middle",fill:"#fff","font-size":30,"font-weight":700,opacity:0});
  t.textContent="$"+v.toFixed(1)+"M";
  var l=el(bs,"text",{x:x+bw/2,y:base+36,"text-anchor":"middle",fill:"#8fa2cf","font-size":24});
  l.textContent=ql[i];
  bars.push(r);vals.push(t);
});
var badge=el(bs,"text",{x:bx0+3*(bw+gap)+bw/2,y:base-qv[3]/1.2*maxh-62,"text-anchor":"middle",fill:"#6ff0c4","font-size":20,"font-weight":700,"letter-spacing":3,opacity:0});
badge.textContent="BEST QUARTER";

// charts
var cs=document.getElementById("charts");
var gv=[2,3,3,5,4,6,7,9],mn=["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug"];
var lx0=120,lx1=660,ly0=600,ly1=220;
function px(i){return lx0+i*(lx1-lx0)/7}
function py(v){return ly0-(v/10)*(ly0-ly1)}
for(var g=0;g<=10;g+=2){
  el(cs,"line",{x1:lx0-10,x2:lx1+10,y1:py(g),y2:py(g),stroke:"#232d4d","stroke-width":1});
  var gt=el(cs,"text",{x:lx0-20,y:py(g)+5,"text-anchor":"end",fill:"#6c7da8","font-size":15});gt.textContent=g+"%";
}
mn.forEach(function(m,i){var t=el(cs,"text",{x:px(i),y:ly0+30,"text-anchor":"middle",fill:"#8fa2cf","font-size":16});t.textContent=m});
// smooth path (catmull-rom -> bezier)
var pts=gv.map(function(v,i){return[px(i),py(v)]});
var d="M"+pts[0][0]+","+pts[0][1];
for(var i=0;i<pts.length-1;i++){
  var p0=pts[Math.max(i-1,0)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(i+2,pts.length-1)];
  d+=" C"+(p1[0]+(p2[0]-p0[0])/6)+","+(p1[1]+(p2[1]-p0[1])/6)+" "+(p2[0]-(p3[0]-p1[0])/6)+","+(p2[1]-(p3[1]-p1[1])/6)+" "+p2[0]+","+p2[1];
}
el(cs,"defs",{}).innerHTML='<linearGradient id="lg" x1="0" x2="1"><stop offset="0" stop-color="#7cc4ff"/><stop offset="1" stop-color="#4ee0b5"/></linearGradient><linearGradient id="af" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4ee0b5" stop-opacity=".28"/><stop offset="1" stop-color="#4ee0b5" stop-opacity="0"/></linearGradient><clipPath id="cp"><rect id="cr" x="0" y="0" width="0" height="720"/></clipPath>';
var grp=el(cs,"g",{"clip-path":"url(#cp)"});
el(grp,"path",{d:d+" L"+pts[7][0]+","+ly0+" L"+pts[0][0]+","+ly0+" Z",fill:"url(#af)"});
el(grp,"path",{d:d,fill:"none",stroke:"url(#lg)","stroke-width":5,"stroke-linecap":"round"});
var dots=pts.map(function(p){return el(cs,"circle",{cx:p[0],cy:p[1],r:0,fill:"#0a0e1a",stroke:"#7cf0cc","stroke-width":3})});
var endl=el(cs,"text",{x:pts[7][0],y:pts[7][1]-18,"text-anchor":"middle",fill:"#fff","font-size":22,"font-weight":700,opacity:0});endl.textContent="9%";
var cr=document.getElementById("cr");

// donut
var reg=[["EMEA",45,"#7cc4ff"],["Americas",35,"#8b7bff"],["APAC",20,"#4ee0b5"]];
var cx=975,cy=440,R=105,SW=44,C=2*Math.PI*R,off=0,arcs=[];
el(cs,"circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:"#1a2342","stroke-width":SW});
reg.forEach(function(r){
  var len=C*r[1]/100;
  var c=el(cs,"circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:r[2],"stroke-width":SW,"stroke-dasharray":"0 "+C,transform:"rotate(-90 "+cx+" "+cy+")"});
  arcs.push({c:c,start:off,len:len});off+=len;
});
var dt=el(cs,"text",{x:cx,y:cy+8,"text-anchor":"middle",fill:"#fff","font-size":34,"font-weight":800});dt.textContent="$3.4M";
var dt2=el(cs,"text",{x:cx,y:cy+34,"text-anchor":"middle",fill:"#8fa2cf","font-size":15,"letter-spacing":2});dt2.textContent="TOTAL";
var lg=document.getElementById("legend");
reg.forEach(function(r){lg.insertAdjacentHTML("beforeend",'<div><i style="background:'+r[2]+'"></i>'+r[0]+'<b>'+r[1]+'%</b></div>')});
var lgi=lg.children;

var revEl=document.getElementById("rev"),bar=document.getElementById("bar");
var t1=document.getElementById("t1"),st1=document.getElementById("st1");

function frame(t){
  // scene visibility
  for(var i=0;i<4;i++){
    var a=rng[i][0],b=rng[i][1],fi=seg(t,a,a+.5),fo=i<3?seg(t,b-.5,b):0;
    var o=eio(fi)*(1-eio(fo));
    S[i].style.opacity=o;
    S[i].style.transform="translateY("+((1-eio(fi))*24-eio(fo)*16)+"px)";
  }
  // s1
  t1.style.transform="scale("+(0.92+0.08*eo(seg(t,0,1.4)))+")";
  t1.style.letterSpacing=(-2+ (1-eo(seg(t,0,1.6)))*10)+"px";
  st1.style.opacity=eio(seg(t,.8,1.5));
  st1.style.transform="translateY("+((1-eo(seg(t,.8,1.5)))*16)+"px)";
  // s2
  var rv=3.4*eo(seg(t,2.7,4.2));
  revEl.textContent="$"+rv.toFixed(1)+"M";
  for(i=0;i<4;i++){
    var p=eob(seg(t,3.0+i*.22,3.9+i*.22)),h=qv[i]/1.2*maxh*p;
    bars[i].setAttribute("height",Math.max(0,h));bars[i].setAttribute("y",base-Math.max(0,h));
    vals[i].setAttribute("y",base-Math.max(0,h)-12);
    vals[i].setAttribute("opacity",eio(seg(t,3.6+i*.22,4.1+i*.22)));
  }
  var hl=eio(seg(t,4.4,4.9));
  badge.setAttribute("opacity",hl);
  badge.setAttribute("y",base-qv[3]/1.2*maxh-50+(1-hl)*10);
  // s3
  cr.setAttribute("width",1280*eio(seg(t,5.8,7.4))*(1));
  // reveal line proportionally to its extent
  var lp=eio(seg(t,5.8,7.4));cr.setAttribute("width",lx0-30+(lx1-lx0+60)*lp);
  dots.forEach(function(dd,k){dd.setAttribute("r",7*eob(seg(t,5.8+k*.2,6.3+k*.2)))});
  endl.setAttribute("opacity",eio(seg(t,7.2,7.6)));
  arcs.forEach(function(a,k){
    var f=eio(seg(t,6.0+k*.35,7.2+k*.35));
    a.c.setAttribute("stroke-dasharray",Math.max(0,a.len*f-(f>0?2:0))+" "+C);
    a.c.setAttribute("stroke-dashoffset",-a.start);
    lgi[k].style.opacity=eio(seg(t,6.6+k*.3,7.1+k*.3));
    lgi[k].style.transform="translateX("+((1-eo(seg(t,6.6+k*.3,7.1+k*.3)))*20)+"px)";
  });
  bar.style.width=(t/10*100)+"%";
}
var t0=null;
function loop(ts){
  if(t0===null)t0=ts;
  var t=((ts-t0)/1000)%10.6;
  if(t>10)t=10;
  frame(t);
  requestAnimationFrame(loop);
}
frame(0);
requestAnimationFrame(loop);
})();
</script>
</body>
</html>
