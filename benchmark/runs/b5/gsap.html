<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Hiring Update</title>
<style>
html,body{margin:0;background:#05070d;height:100%;overflow:hidden}
#stage{position:relative;width:1280px;height:720px;overflow:hidden;font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;color:#eef2fb;
background:radial-gradient(900px 600px at 20% 10%,#16223f 0%,transparent 60%),radial-gradient(800px 600px at 90% 100%,#1d1646 0%,transparent 60%),#0a0e1a;
transform-origin:0 0}
.scene{position:absolute;inset:0;opacity:0}
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.eyebrow{font-size:20px;letter-spacing:.35em;text-transform:uppercase;color:#7aa2ff;font-weight:600}
h1{margin:18px 0 0;font-size:120px;font-weight:800;letter-spacing:-.03em;line-height:1}
.sub{margin-top:22px;font-size:40px;color:#a9b6d3;font-weight:500}
.sub b{color:#5eead4}
.rule{width:120px;height:4px;border-radius:2px;background:linear-gradient(90deg,#7aa2ff,#5eead4);margin-top:30px}
.lbl{font-size:22px;letter-spacing:.2em;text-transform:uppercase;color:#8e9bb8;font-weight:600}
#s2 .top{position:absolute;top:50px;left:0;right:0;text-align:center}
#num{font-size:170px;font-weight:800;line-height:1;letter-spacing:-.04em;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#9fb8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
#s2 svg{position:absolute;left:290px;top:300px}
#s3 .card{position:absolute;top:110px;height:500px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.ct{position:absolute;left:36px;top:28px;font-size:20px;letter-spacing:.14em;text-transform:uppercase;color:#8e9bb8;font-weight:600}
#legend{position:absolute;left:300px;top:150px;width:260px}
.li{display:flex;align-items:center;margin-bottom:26px;font-size:26px;opacity:0}
.li i{width:16px;height:16px;border-radius:5px;margin-right:14px}
.li span{margin-left:auto;font-weight:700;color:#fff;padding-left:14px}
.big{font-size:150px;font-weight:800;letter-spacing:-.03em}
</style></head><body>
<div id="stage">
 <div class="scene center" id="s1">
  <div class="eyebrow" id="e1">People &amp; Culture</div>
  <h1 id="t1">Hiring Update</h1>
  <div class="sub" id="st1">Team grew <b>30%</b></div>
  <div class="rule" id="r1"></div>
 </div>

 <div class="scene" id="s2">
  <div class="top"><div class="lbl" id="l2">New hires</div><div id="num">0</div></div>
  <svg id="bars" width="700" height="360" viewBox="0 0 700 360"></svg>
 </div>

 <div class="scene" id="s3">
  <div class="card" style="left:70px;width:600px"><div class="ct">Hires by department</div>
   <svg id="donut" width="240" height="240" viewBox="-120 -120 240 240" style="position:absolute;left:30px;top:130px"></svg>
   <div id="legend"></div>
  </div>
  <div class="card" style="left:710px;width:500px"><div class="ct">Open roles</div>
   <svg id="line" width="440" height="360" viewBox="0 0 440 360" style="position:absolute;left:30px;top:100px"></svg>
  </div>
 </div>

 <div class="scene center" id="s4">
  <h1 id="t4" style="font-size:130px">Welcome aboard</h1>
  <div class="rule" id="r4"></div>
 </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
const NS="http://www.w3.org/2000/svg";
function el(p,n,a,t){const e=document.createElementNS(NS,n);for(const k in a)e.setAttribute(k,a[k]);if(t!=null)e.textContent=t;p.appendChild(e);return e}
// scale stage to fit window
function fit(){const s=Math.min(innerWidth/1280,innerHeight/720);const st=document.getElementById('stage');st.style.transform='scale('+s+')';st.style.marginLeft=((innerWidth-1280*s)/2)+'px';st.style.marginTop=((innerHeight-720*s)/2)+'px'}
fit();addEventListener('resize',fit);

// bars
const months=['Mar','Apr','May','Jun','Jul'],hires=[2,4,6,7,5],best=3;
const bs=document.getElementById('bars'),bw=96,gap=40,base=300,unit=36;
const barEls=[],valEls=[];
el(bs,'line',{x1:0,x2:700,y1:base,y2:base,stroke:'rgba(255,255,255,.15)'});
hires.forEach((v,i)=>{
 const x=i*(bw+gap)+(700-(5*bw+4*gap))/2, h=v*unit, hl=i===best;
 const r=el(bs,'rect',{x,y:base-h,width:bw,height:h,rx:10,fill:hl?'#5eead4':'#4b6bd6'});
 r.style.transformOrigin=x+bw/2+'px '+base+'px';
 const t=el(bs,'text',{x:x+bw/2,y:base-h-12,'text-anchor':'middle',fill:hl?'#5eead4':'#dbe4fb','font-size':26,'font-weight':700},v);
 el(bs,'text',{x:x+bw/2,y:base+36,'text-anchor':'middle',fill:'#8e9bb8','font-size':22,'font-weight':600},months[i]);
 barEls.push(r);valEls.push(t);
});
const bestTag=el(bs,'text',{x:3*(bw+gap)+(700-(5*bw+4*gap))/2+bw/2,y:base-7*unit-48,'text-anchor':'middle',fill:'#5eead4','font-size':16,'font-weight':700,'letter-spacing':'2'},'BEST MONTH');

// donut
const dd=[['Engineering',45,'#7aa2ff'],['Sales',30,'#5eead4'],['Design',15,'#f59ee6'],['Ops',10,'#fbbf6a']];
const dn=document.getElementById('donut'),R=85,C=2*Math.PI*R;
el(dn,'circle',{r:R,fill:'none',stroke:'rgba(255,255,255,.06)','stroke-width':34});
let acc=0;const segs=[];
dd.forEach(d=>{const len=C*d[1]/100;
 const c=el(dn,'circle',{r:R,fill:'none',stroke:d[2],'stroke-width':34,'stroke-dasharray':'0 '+C,'stroke-dashoffset':-acc,transform:'rotate(-90)'});
 segs.push([c,len-3]);acc+=len});
const lg=document.getElementById('legend');
dd.forEach(d=>{const r=document.createElement('div');r.className='li';r.innerHTML='<i style="background:'+d[2]+'"></i>'+d[0]+'<span>'+d[1]+'%</span>';lg.appendChild(r)});

// line (smooth catmull-rom)
const ls=document.getElementById('line'),open=[18,15,14,10,8];
const pts=open.map((v,i)=>[30+i*95,40+(18-v)*(240/12)]);
let d='M'+pts[0];
for(let i=0;i<pts.length-1;i++){const p0=pts[i-1]||pts[i],p1=pts[i],p2=pts[i+1],p3=pts[i+2]||p2;
 d+=' C'+[p1[0]+(p2[0]-p0[0])/6,p1[1]+(p2[1]-p0[1])/6,p2[0]-(p3[0]-p1[0])/6,p2[1]-(p3[1]-p1[1])/6,p2[0],p2[1]].join(',')}
const area=el(ls,'path',{d:d+' L'+pts[4][0]+',300 L'+pts[0][0]+',300Z',fill:'url(#ag)',opacity:0});
const defs=el(ls,'defs',{});const g=el(defs,'linearGradient',{id:'ag',x1:0,y1:0,x2:0,y2:1});
el(g,'stop',{offset:0,'stop-color':'#7aa2ff','stop-opacity':.35});el(g,'stop',{offset:1,'stop-color':'#7aa2ff','stop-opacity':0});
el(ls,'line',{x1:0,x2:440,y1:300,y2:300,stroke:'rgba(255,255,255,.15)'});
const path=el(ls,'path',{d,fill:'none',stroke:'#7aa2ff','stroke-width':5,'stroke-linecap':'round'});
const PL=path.getTotalLength();path.style.strokeDasharray=PL;path.style.strokeDashoffset=PL;
const dots=[],dl=[];
pts.forEach((p,i)=>{
 dots.push(el(ls,'circle',{cx:p[0],cy:p[1],r:0,fill:'#0a0e1a',stroke:'#5eead4','stroke-width':4}));
 dl.push(el(ls,'text',{x:p[0],y:p[1]-18,'text-anchor':'middle',fill:'#eef2fb','font-size':22,'font-weight':700,opacity:0},open[i]));
 el(ls,'text',{x:p[0],y:334,'text-anchor':'middle',fill:'#8e9bb8','font-size':20,'font-weight':600},months[i]);
});

// timeline
const E='power3.out';
gsap.set(['#s1','#s2','#s3','#s4'],{opacity:0});
gsap.set('#s1',{opacity:1});
gsap.set(['#e1','#st1'],{opacity:0,y:24});gsap.set('#t1',{opacity:0,y:40,scale:.96});gsap.set('#r1',{scaleX:0});
gsap.set('#t4',{opacity:0,y:30,scale:.96});gsap.set('#r4',{scaleX:0});
gsap.set(barEls,{scaleY:0});gsap.set(valEls,{opacity:0,y:10});gsap.set(bestTag,{opacity:0});
gsap.set('#l2',{opacity:0,y:-12});gsap.set('#num',{opacity:0,y:20});

const tl=gsap.timeline({defaults:{ease:E}});
// scene 1 (0 - 2.0)
tl.to('#e1',{opacity:1,y:0,duration:.6},.15)
  .to('#t1',{opacity:1,y:0,scale:1,duration:.9},.3)
  .to('#r1',{scaleX:1,duration:.6},.8)
  .to('#st1',{opacity:1,y:0,duration:.7},.9)
  .to('#s1',{opacity:0,y:-20,duration:.45,ease:'power2.in'},1.85)
// scene 2 (2.3 - 5.2)
  .set('#s2',{opacity:1},2.3)
  .to('#l2',{opacity:1,y:0,duration:.5},2.3)
  .to('#num',{opacity:1,y:0,duration:.5},2.4)
  .to({v:0},{v:24,duration:2.0,ease:'power2.inOut',onUpdate:function(){document.getElementById('num').textContent=Math.round(this.targets()[0].v)}},2.5)
  .to(barEls,{scaleY:1,duration:.8,stagger:.18,ease:'back.out(1.2)'},2.7)
  .to(valEls,{opacity:1,y:0,duration:.4,stagger:.18},3.1)
  .to(barEls[best],{fill:'#5eead4',duration:.3},4.0)
  .to(bestTag,{opacity:1,duration:.5},4.2)
  .to('#s2',{opacity:0,y:-20,duration:.45,ease:'power2.in'},5.1)
// scene 3 (5.6 - 7.9)
  .set('#s3',{opacity:1},5.6)
  .from('#s3 .card',{opacity:0,y:30,duration:.6,stagger:.15},5.6)
  .to(segs.map(s=>s[0]),{attr:{'stroke-dasharray':(i)=>segs[i][1]+' '+C},duration:.9,stagger:.18,ease:'power2.out'},5.9)
  .to('.li',{opacity:1,x:0,duration:.4,stagger:.15},6.0)
  .to(path,{strokeDashoffset:0,duration:1.2,ease:'power2.inOut'},6.0)
  .to(area,{opacity:1,duration:.8},6.6)
  .to(dots,{attr:{r:7},duration:.35,stagger:.22,ease:'back.out(2)'},6.1)
  .to(dl,{opacity:1,duration:.3,stagger:.22},6.2)
  .to('#s3',{opacity:0,y:-20,duration:.45,ease:'power2.in'},8.0)
// scene 4 (8.3 - 9)
  .set('#s4',{opacity:1},8.3)
  .to('#t4',{opacity:1,y:0,scale:1,duration:.7},8.3)
  .to('#r4',{scaleX:1,duration:.5},8.55);
tl.set({}, {}, 9);
gsap.set('.li',{x:-16});
</script>
</body></html>
