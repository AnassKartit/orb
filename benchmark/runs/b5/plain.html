<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hiring Update</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
  :root{--bg:#0b1020;--bg2:#141b34;--text:#f2f5ff;--muted:#8d97b8;--accent:#ffb454;--blue:#4f8cff;--teal:#2dd4bf;--pink:#f472b6;--violet:#a78bfa}
  html,body{margin:0;height:100%;background:#05070f;overflow:hidden;font-family:"Segoe UI",Inter,Helvetica,Arial,sans-serif}
  #wrap{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1280px;height:720px;flex:none;transform-origin:center center;overflow:hidden;color:var(--text);
    background:radial-gradient(900px 600px at 20% 15%,#1b2550 0%,transparent 60%),radial-gradient(800px 600px at 85% 90%,#2a1b46 0%,transparent 60%),var(--bg)}
  .scene{position:absolute;inset:0;opacity:0;will-change:opacity,transform}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{margin:0;font-size:96px;font-weight:800;letter-spacing:-2px}
  .sub{margin-top:18px;font-size:38px;color:var(--accent);font-weight:600;letter-spacing:1px}
  .bar-line{width:120px;height:5px;border-radius:3px;background:linear-gradient(90deg,var(--blue),var(--accent));margin-top:34px;transform-origin:center}
  .kicker{position:absolute;left:80px;top:48px;font-size:22px;letter-spacing:4px;text-transform:uppercase;color:var(--muted);font-weight:600}
  #count{position:absolute;left:0;right:0;top:70px;text-align:center}
  #num{font-size:170px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums;background:linear-gradient(180deg,#fff,#aebcff);-webkit-background-clip:text;background-clip:text;color:transparent}
  #cl{font-size:30px;color:var(--muted);letter-spacing:6px;text-transform:uppercase;margin-top:4px}
  .panel{position:absolute;top:120px;height:520px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08);border-radius:24px}
  .ptitle{position:absolute;left:32px;top:26px;font-size:24px;font-weight:700}
  .psub{position:absolute;left:32px;top:60px;font-size:16px;color:var(--muted)}
  svg{position:absolute;left:0;top:0}
  text{font-family:inherit}
</style>
</head>
<body>
<div id="wrap"><div id="stage">

  <div class="scene center" id="s1">
    <h1 id="t1">Hiring Update</h1>
    <div class="sub" id="t2">Team grew 30%</div>
    <div class="bar-line" id="t3"></div>
  </div>

  <div class="scene" id="s2">
    <div class="kicker">Hiring Update &middot; 2026</div>
    <div id="count"><div id="num">0</div><div id="cl">New hires</div></div>
    <svg id="bars" width="1280" height="720"></svg>
  </div>

  <div class="scene" id="s3">
    <div class="kicker">Hiring Update &middot; 2026</div>
    <div class="panel" style="left:80px;width:560px"><div class="ptitle">Hires by department</div><div class="psub">Share of 24 new hires</div></div>
    <div class="panel" style="left:664px;width:536px"><div class="ptitle">Open roles</div><div class="psub">Monthly, Mar to Jul</div></div>
    <svg id="s3svg" width="1280" height="720"></svg>
  </div>

  <div class="scene center" id="s4">
    <h1 id="w1" style="font-size:110px">Welcome aboard</h1>
    <div class="bar-line" id="w2"></div>
  </div>

</div></div>

<script>
(function(){
var NS="http://www.w3.org/2000/svg", DUR=9;
var $=function(id){return document.getElementById(id)};
function el(tag,attrs,parent){var e=document.createElementNS(NS,tag);for(var k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e}
function clamp(x){return Math.max(0,Math.min(1,x))}
function seg(t,a,b){return clamp((t-a)/(b-a))}
function eo(x){return 1-Math.pow(1-x,3)}
function eio(x){return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2}
function eob(x){var c=1.4,d=c+1;return 1+d*Math.pow(x-1,3)+c*Math.pow(x-1,2)}

/* scale stage to window */
var stage=$("stage");
function fit(){var s=Math.min(innerWidth/1280,innerHeight/720);stage.style.transform="scale("+s+")"}
addEventListener("resize",fit);fit();

/* scene visibility: [start,end], fade durations */
var scenes=[
  {e:$("s1"),a:0,b:2.2},
  {e:$("s2"),a:2.2,b:5.0},
  {e:$("s3"),a:5.0,b:8.0},
  {e:$("s4"),a:8.0,b:9.01}
];
function sceneOp(s,t){
  var f=.35, i=seg(t,s.a,s.a+f), o=s===scenes[3]?1:1-seg(t,s.b-f,s.b);
  if(s===scenes[0])i=1;
  return {op:eo(i)*o,i:i};
}

/* ---- bar chart ---- */
var bars=$("bars"), months=["Mar","Apr","May","Jun","Jul"], hires=[2,4,6,7,5];
var bx0=290, bw=100, gap=40, base=640, maxH=250, barEls=[], valEls=[];
el("line",{x1:240,x2:1040,y1:base,y2:base,stroke:"rgba(255,255,255,.18)","stroke-width":2},bars);
var defs=el("defs",{},bars);
function grad(id,c1,c2){var g=el("linearGradient",{id:id,x1:0,y1:0,x2:0,y2:1},defs);el("stop",{offset:0,"stop-color":c1},g);el("stop",{offset:1,"stop-color":c2},g)}
grad("gb","#6aa0ff","#3a5fd0");grad("ga","#ffd08a","#ff9a3c");
hires.forEach(function(v,i){
  var x=bx0+i*(bw+gap), best=v===7;
  var r=el("rect",{x:x,y:base,width:bw,height:0,rx:10,fill:best?"url(#ga)":"url(#gb)"},bars);
  var val=el("text",{x:x+bw/2,y:base-10,"text-anchor":"middle","font-size":34,"font-weight":700,fill:best?"#ffb454":"#f2f5ff",opacity:0},bars);
  val.textContent=v;
  var m=el("text",{x:x+bw/2,y:base+34,"text-anchor":"middle","font-size":22,fill:best?"#ffb454":"#8d97b8","font-weight":best?700:500},bars);
  m.textContent=months[i];
  barEls.push(r);valEls.push(val);
});
var badge=el("g",{opacity:0},bars);
el("rect",{x:bx0+3*(bw+gap)+bw/2-62,y:0,width:124,height:30,rx:15,fill:"#ffb454"},badge);
var bt=el("text",{x:bx0+3*(bw+gap)+bw/2,y:0,"text-anchor":"middle","font-size":16,"font-weight":800,fill:"#1a1205","letter-spacing":1},badge);
bt.textContent="BEST MONTH";
var capt=el("text",{x:1120,y:base-110,"text-anchor":"middle","font-size":18,fill:"#8d97b8"},bars);
capt.textContent="Hires per month";
capt.setAttribute("opacity",0);

function drawS2(t){ /* t local seconds 0..2.8 */
  $("num").textContent=Math.round(24*eio(seg(t,.2,1.8)));
  $("count").style.transform="translateY("+((1-eo(seg(t,0,.7)))*20)+"px)";
  hires.forEach(function(v,i){
    var p=eob(seg(t,.5+i*.12,1.3+i*.12)), h=v/7*maxH*p;
    barEls[i].setAttribute("y",base-h);barEls[i].setAttribute("height",Math.max(0,h));
    var vo=seg(t,.9+i*.12,1.3+i*.12);
    valEls[i].setAttribute("y",base-h-14);valEls[i].setAttribute("opacity",vo);
  });
  var hb=7/7*maxH, bo=eo(seg(t,1.6,2.1));
  badge.setAttribute("opacity",bo);
  var by=base-hb-86-(1-bo)*10;
  badge.firstChild.setAttribute("y",by);bt.setAttribute("y",by+21);
  capt.setAttribute("opacity",seg(t,1,1.5));
  /* pulse highlight on best bar */
  var pl=1+.03*Math.sin(Math.max(0,t-1.8)*6)*bo;
  barEls[3].setAttribute("transform","translate("+(bx0+3*(bw+gap)+bw/2)+" "+base+") scale(1 "+pl+") translate("+(-(bx0+3*(bw+gap)+bw/2))+" "+(-base)+")");
}

/* ---- donut + line ---- */
var s3=$("s3svg"), depts=[["Engineering",45,"#4f8cff"],["Sales",30,"#2dd4bf"],["Design",15,"#f472b6"],["Ops",10,"#ffb454"]];
var cx=225, cy=400, R=100, SW=44, C=2*Math.PI*R, segEls=[], legEls=[];
el("circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:"rgba(255,255,255,.06)","stroke-width":SW},s3);
var cum=0;
depts.forEach(function(d,i){
  var c=el("circle",{cx:cx,cy:cy,r:R,fill:"none",stroke:d[2],"stroke-width":SW,transform:"rotate(-90 "+cx+" "+cy+")","stroke-dasharray":"0 "+C},s3);
  segEls.push({c:c,start:cum,frac:d[1]/100});cum+=d[1]/100;
  var g=el("g",{opacity:0},s3), ly=340+i*52;
  el("rect",{x:385,y:ly-16,width:18,height:18,rx:5,fill:d[2]},g);
  var n=el("text",{x:414,y:ly,"font-size":22,fill:"#f2f5ff","font-weight":500},g);n.textContent=d[0];
  var p=el("text",{x:600,y:ly,"font-size":22,"text-anchor":"end",fill:d[2],"font-weight":700},g);p.textContent=d[1]+"%";
  legEls.push(g);
});
var dc=el("text",{x:cx,y:cy+14,"text-anchor":"middle","font-size":44,"font-weight":800,fill:"#f2f5ff",opacity:0},s3);dc.textContent="24";
var dl=el("text",{x:cx,y:cy+40,"text-anchor":"middle","font-size":14,fill:"#8d97b8",opacity:0,"letter-spacing":2},s3);dl.textContent="HIRES";

var roles=[18,15,14,10,8], lx0=730, lx1=1150, ly0=250, ly1=560, vmax=20;
function px(i){return lx0+i*(lx1-lx0)/4}
function py(v){return ly1-(v/vmax)*(ly1-ly0)}
[0,10,20].forEach(function(v){
  el("line",{x1:700,x2:1170,y1:py(v),y2:py(v),stroke:"rgba(255,255,255,.08)","stroke-width":1},s3);
  var tx=el("text",{x:694,y:py(v)+5,"text-anchor":"end","font-size":14,fill:"#8d97b8"},s3);tx.textContent=v;
});
var pts=roles.map(function(v,i){return [px(i),py(v)]});
var d="M"+pts[0][0]+" "+pts[0][1];
for(var i=0;i<pts.length-1;i++){
  var p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  d+=" C"+(p1[0]+(p2[0]-p0[0])/6)+" "+(p1[1]+(p2[1]-p0[1])/6)+","+(p2[0]-(p3[0]-p1[0])/6)+" "+(p2[1]-(p3[1]-p1[1])/6)+","+p2[0]+" "+p2[1];
}
var area=el("path",{d:d+" L"+px(4)+" "+ly1+" L"+px(0)+" "+ly1+" Z",fill:"url(#la)",opacity:0},s3);
var ld=el("defs",{},s3), lg=el("linearGradient",{id:"la",x1:0,y1:0,x2:0,y2:1},ld);
el("stop",{offset:0,"stop-color":"#a78bfa","stop-opacity":.35},lg);el("stop",{offset:1,"stop-color":"#a78bfa","stop-opacity":0},lg);
var line=el("path",{d:d,fill:"none",stroke:"#a78bfa","stroke-width":5,"stroke-linecap":"round",pathLength:1,"stroke-dasharray":"1 1","stroke-dashoffset":1},s3);
var dots=[],lbls=[];
pts.forEach(function(p,i){
  var c=el("circle",{cx:p[0],cy:p[1],r:0,fill:"#0b1020",stroke:"#a78bfa","stroke-width":4},s3);
  var v=el("text",{x:p[0],y:p[1]-18,"text-anchor":"middle","font-size":22,"font-weight":700,fill:"#f2f5ff",opacity:0},s3);v.textContent=roles[i];
  var m=el("text",{x:p[0],y:ly1+34,"text-anchor":"middle","font-size":18,fill:"#8d97b8"},s3);m.textContent=months[i];
  dots.push(c);lbls.push(v);
});

function drawS3(t){ /* local 0..3 */
  var sw=eio(seg(t,.3,1.7));
  segEls.forEach(function(s){
    var l=clamp((sw-s.start)/s.frac)*s.frac*C;
    s.c.setAttribute("stroke-dasharray",Math.max(0,l-(l>2?2:0))+" "+C);
    s.c.setAttribute("stroke-dashoffset",0);
  });
  dc.setAttribute("opacity",seg(t,.9,1.4));dl.setAttribute("opacity",seg(t,1,1.5));
  legEls.forEach(function(g,i){
    var o=eo(seg(t,.5+i*.18,1+i*.18));
    g.setAttribute("opacity",o);g.setAttribute("transform","translate("+((1-o)*-16)+" 0)");
  });
  var lp=eio(seg(t,.6,2.2));
  line.setAttribute("stroke-dashoffset",1-lp);
  area.setAttribute("opacity",seg(t,1.6,2.4));
  pts.forEach(function(p,i){
    var th=i/4, o=seg(lp,th-.02,th+.08);
    dots[i].setAttribute("r",8*eob(o));lbls[i].setAttribute("opacity",o);
  });
}

/* ---- title scenes ---- */
function drawS1(t){
  var a=eo(seg(t,.15,.9)), b=eo(seg(t,.6,1.3)), c=eo(seg(t,.9,1.5));
  var h=$("t1");h.style.opacity=a;h.style.transform="translateY("+((1-a)*28)+"px)";
  var s=$("t2");s.style.opacity=b;s.style.transform="translateY("+((1-b)*20)+"px)";
  $("t3").style.transform="scaleX("+c+")";
}
function drawS4(t){
  var a=eo(seg(t,.1,.7)), c=eo(seg(t,.4,.9));
  var h=$("w1");h.style.opacity=a;h.style.transform="scale("+(.94+.06*a)+")";
  $("w2").style.transform="scaleX("+c+")";
}

function render(t){
  scenes.forEach(function(s,i){
    var r=sceneOp(s,t);
    s.e.style.opacity=(t>=s.a&&t<=s.b+.01)||i===3&&t>=s.a?r.op:0;
    s.e.style.visibility=s.e.style.opacity>0?"visible":"hidden";
  });
  drawS1(Math.min(t,2.2));
  drawS2(clamp((t-2.2)/2.8)*2.8+Math.max(0,t-5)*0);
  drawS3(Math.max(0,t-5));
  drawS4(Math.max(0,t-8));
}

var t0=null;
function frame(now){
  if(t0===null)t0=now;
  var t=Math.min((now-t0)/1000,DUR);
  render(t);
  requestAnimationFrame(frame);
}
render(0);
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
