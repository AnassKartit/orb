<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Uptime Report</title>
<style>
  html,body{margin:0;background:#05080f;height:100%;overflow:hidden}
  body{display:flex;align-items:center;justify-content:center}
  #stage{position:relative;width:1280px;height:720px;overflow:hidden;color:#e8eefc;
    font-family:Inter,"Segoe UI",Helvetica,Arial,sans-serif;
    background:radial-gradient(900px 600px at 20% 10%,#14213d 0%,#0a1020 55%,#060a14 100%)}
  .scene{position:absolute;inset:0;opacity:0}
  .center{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  h1{margin:0;font-size:104px;font-weight:800;letter-spacing:-2px;background:linear-gradient(90deg,#7aa8ff,#5ef2c8);-webkit-background-clip:text;background-clip:text;color:transparent}
  .sub{margin-top:18px;font-size:34px;letter-spacing:8px;text-transform:uppercase;color:#8fa3c8}
  .rule{width:140px;height:4px;border-radius:2px;background:#5ef2c8;margin-top:34px}
  .label{font-size:22px;letter-spacing:6px;text-transform:uppercase;color:#8fa3c8}
  #counter{position:absolute;left:0;right:0;top:44px;text-align:center}
  #counter .num{font-size:128px;font-weight:800;line-height:1.05;color:#5ef2c8;font-variant-numeric:tabular-nums}
  #bars{position:absolute;left:190px;top:310px;width:900px;height:290px}
  .col{position:absolute;bottom:40px;width:100px;display:flex;flex-direction:column;align-items:center}
  .bar{width:100px;border-radius:10px 10px 0 0;background:linear-gradient(#6f9bff,#3d63c9);transform-origin:50% 100%}
  .bar.worst{background:linear-gradient(#ff9a6b,#ff4d5e);box-shadow:0 0 40px rgba(255,77,94,.55)}
  .val{position:absolute;font-size:24px;font-weight:700;width:100px;text-align:center}
  .mon{position:absolute;bottom:0;width:100px;text-align:center;font-size:22px;color:#8fa3c8}
  .base{position:absolute;left:0;right:0;bottom:40px;height:2px;background:#26334f}
  .cap{position:absolute;left:0;right:0;top:268px;text-align:center}
  .panel{position:absolute;top:110px;height:500px;border-radius:24px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
  .ptitle{position:absolute;left:32px;top:24px}
  .legend{position:absolute;left:330px;top:150px}
  .legend div{display:flex;align-items:center;font-size:26px;margin-bottom:26px;opacity:0}
  .legend i{width:18px;height:18px;border-radius:5px;margin-right:14px;display:inline-block}
  .legend b{margin-left:auto;padding-left:24px;color:#8fa3c8;font-weight:600}
  .big{font-size:120px}
</style>
</head>
<body>
<div id="stage">
  <div class="scene center" id="s1">
    <h1 id="t1">Uptime Report</h1>
    <div class="sub" id="sub">Q3 reliability</div>
    <div class="rule" id="rule"></div>
  </div>

  <div class="scene" id="s2">
    <div id="counter"><div class="label">Uptime</div><div class="num" id="num">0.00%</div></div>
    <div class="label cap">Incident minutes per month</div>
    <div id="bars"><div class="base"></div></div>
  </div>

  <div class="scene" id="s3">
    <div class="panel" style="left:60px;width:600px">
      <div class="label ptitle">Response time (ms)</div>
      <svg width="600" height="500" viewBox="0 0 600 500" id="lsvg">
        <g id="grid" stroke="#26334f" stroke-width="1"></g>
        <path id="area" fill="url(#ag)" opacity="0"/>
        <defs><linearGradient id="ag" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5ef2c8" stop-opacity=".35"/><stop offset="1" stop-color="#5ef2c8" stop-opacity="0"/></linearGradient></defs>
        <path id="line" fill="none" stroke="#5ef2c8" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
        <g id="pts"></g><g id="lbls"></g>
      </svg>
    </div>
    <div class="panel" style="left:700px;width:520px">
      <div class="label ptitle">Incident causes</div>
      <svg width="300" height="300" viewBox="-150 -150 300 300" style="position:absolute;left:10px;top:150px" id="dsvg"></svg>
      <div class="legend" style="left:320px;top:200px;position:absolute;width:170px" id="leg"></div>
    </div>
  </div>

  <div class="scene center" id="s4">
    <h1 id="t4" class="big">Stay online</h1>
    <div class="rule" id="rule4"></div>
  </div>
</div>

<script type="module">
import { animate, createTimeline, stagger, createDrawable, createSpring, utils } from 'https://cdn.jsdelivr.net/npm/animejs@4/+esm';

const NS = 'http://www.w3.org/2000/svg';
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };

/* ---- bar chart ---- */
const months = ['Jan','Feb','Mar','Apr','May','Jun'];
const inc = [42,31,55,18,12,9];
const bars = document.getElementById('bars');
inc.forEach((v,i) => {
  const h = Math.round(v/55*200), x = i*160 + 20;
  const col = document.createElement('div');
  col.className = 'col'; col.style.left = x+'px';
  col.innerHTML = `<div class="bar${v===55?' worst':''}" style="height:${h}px"></div>`;
  bars.appendChild(col);
  const val = document.createElement('div');
  val.className = 'val'; val.style.left = x+'px'; val.style.bottom = (40+h+8)+'px'; val.style.opacity = 0;
  val.style.color = v===55 ? '#ff7a85' : '#e8eefc'; val.textContent = v;
  bars.appendChild(val);
  const m = document.createElement('div');
  m.className = 'mon'; m.style.left = x+'px'; m.textContent = months[i]; m.style.opacity = 0;
  bars.appendChild(m);
});

/* ---- line chart ---- */
const rt = [210,190,180,160,150,140];
const X0 = 70, X1 = 550, Y0 = 130, Y1 = 400;
const pts = rt.map((v,i) => [X0 + i*(X1-X0)/5, Y0 + (210-v)/70*(Y1-Y0)*-1 + (Y1-Y0)]);
// y: higher ms -> higher on chart
const P = rt.map((v,i) => [X0 + i*(X1-X0)/5, Y1 - (v-130)/(220-130)*(Y1-Y0)]);
let d = `M${P[0][0]},${P[0][1]}`;
for (let i=0;i<P.length-1;i++){
  const p0=P[i-1]||P[i], p1=P[i], p2=P[i+1], p3=P[i+2]||p2;
  const c1=[p1[0]+(p2[0]-p0[0])/6, p1[1]+(p2[1]-p0[1])/6];
  const c2=[p2[0]-(p3[0]-p1[0])/6, p2[1]-(p3[1]-p1[1])/6];
  d += ` C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`;
}
document.getElementById('line').setAttribute('d', d);
document.getElementById('area').setAttribute('d', d + ` L${X1},${Y1+30} L${X0},${Y1+30} Z`);
const grid = document.getElementById('grid');
[140,170,200].forEach(v => {
  const y = Y1 - (v-130)/90*(Y1-Y0);
  el('line',{x1:X0-20,x2:X1+20,y1:y,y2:y},grid);
  const t = el('text',{x:20,y:y+5,fill:'#6b7ea6','font-size':16},grid); t.textContent = v;
});
const pg = document.getElementById('pts'), lg = document.getElementById('lbls');
P.forEach((p,i) => {
  el('circle',{class:'pt',cx:p[0],cy:p[1],r:8,fill:'#05080f',stroke:'#5ef2c8','stroke-width':4,opacity:0},pg);
  const t = el('text',{class:'pl',x:p[0],y:p[1]-18,'text-anchor':'middle',fill:'#e8eefc','font-size':20,'font-weight':700,opacity:0},lg); t.textContent = rt[i];
  const m = el('text',{x:p[0],y:Y1+62,'text-anchor':'middle',fill:'#6b7ea6','font-size':18},lg); m.textContent = months[i];
});

/* ---- donut ---- */
const causes = [['Network',40,'#6f9bff'],['Deploys',35,'#5ef2c8'],['Hardware',25,'#ffb86b']];
const dsvg = document.getElementById('dsvg'), leg = document.getElementById('leg');
const R = 100, gap = 0.025;
let a = -Math.PI/2;
causes.forEach(([n,v,c]) => {
  const sweep = v/100*2*Math.PI;
  const s = a + gap, e = a + sweep - gap;
  const pt = ang => [R*Math.cos(ang), R*Math.sin(ang)];
  const [x1,y1] = pt(s), [x2,y2] = pt(e);
  el('path',{class:'seg',d:`M${x1},${y1} A${R},${R} 0 ${sweep>Math.PI?1:0} 1 ${x2},${y2}`,fill:'none',stroke:c,'stroke-width':36,'stroke-linecap':'butt'},dsvg);
  a += sweep;
  leg.insertAdjacentHTML('beforeend', `<div><i style="background:${c}"></i>${n}<b>${v}%</b></div>`);
});
const ctr = el('text',{id:'dc','text-anchor':'middle',y:12,fill:'#e8eefc','font-size':34,'font-weight':800,opacity:0},dsvg);
ctr.textContent = '3 causes';

/* ---- timeline (10s) ---- */
const cnt = { v: 0 };
const tl = createTimeline({ defaults: { ease: 'outCubic' } });

// Scene 1: 0 - 2.2s
tl.set('#s1', { opacity: 1 }, 0)
  .add('#t1', { opacity: [0,1], translateY: [40,0], scale: [0.94,1], duration: 900, ease: 'outExpo' }, 150)
  .add('#sub', { opacity: [0,1], translateY: [20,0], duration: 700 }, 600)
  .add('#rule', { scaleX: [0,1], duration: 700, ease: 'outExpo' }, 900)
  .add('#s1', { opacity: 0, translateY: -30, duration: 450, ease: 'inCubic' }, 1850);

// Scene 2: 2.3 - 5.0s
tl.set('#s2', { opacity: 1 }, 2300)
  .add('#counter', { opacity: [0,1], translateY: [30,0], duration: 600 }, 2300)
  .add(cnt, { v: 99.98, duration: 1500, ease: 'outExpo',
      onUpdate: () => { document.getElementById('num').textContent = cnt.v.toFixed(2) + '%'; } }, 2400)
  .add('.cap', { opacity: [0,1], duration: 500 }, 2700)
  .add('.bar', { scaleY: [0,1], duration: 800, delay: stagger(90), ease: createSpring({ stiffness: 120, damping: 14 }) }, 2800)
  .add('.val', { opacity: [0,1], translateY: [10,0], duration: 400, delay: stagger(90) }, 3200)
  .add('.mon', { opacity: [0,1], duration: 400, delay: stagger(90) }, 3000)
  .add('.bar.worst', { scaleX: [1,1.08,1], duration: 700, ease: 'inOutSine' }, 4000)
  .add('#s2', { opacity: 0, translateY: -30, duration: 450, ease: 'inCubic' }, 4750);

// Scene 3: 5.3 - 8.3s
tl.set('#s3', { opacity: 1 }, 5300)
  .add('.panel', { opacity: [0,1], translateY: [30,0], duration: 600, delay: stagger(150) }, 5300)
  .add('#area', { opacity: [0,1], duration: 900 }, 6200)
  .add(createDrawable('#line'), { draw: ['0 0','0 1'], duration: 1400, ease: 'inOutCubic' }, 5600)
  .add('.pt', { opacity: [0,1], scale: [0,1], duration: 400, delay: stagger(250) }, 5700)
  .add('.pl', { opacity: [0,1], translateY: [8,0], duration: 400, delay: stagger(250) }, 5800)
  .add(createDrawable('.seg'), { draw: ['0 0','0 1'], duration: 900, delay: stagger(300), ease: 'inOutCubic' }, 5700)
  .add('#dc', { opacity: [0,1], duration: 500 }, 6700)
  .add('#leg div', { opacity: [0,1], translateX: [20,0], duration: 450, delay: stagger(200) }, 6200)
  .add('#s3', { opacity: 0, translateY: -30, duration: 450, ease: 'inCubic' }, 8100);

// Scene 4: 8.6 - 10s
tl.set('#s4', { opacity: 1 }, 8600)
  .add('#t4', { opacity: [0,1], scale: [0.9,1], translateY: [30,0], duration: 900, ease: 'outExpo' }, 8600)
  .add('#rule4', { scaleX: [0,1], duration: 700, ease: 'outExpo' }, 9000);
</script>
</body>
</html>
